name: Deploy to GitHub Pages

# Builds the site (which also validates the data) and publishes dist/ to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# GitHub only lets the repo's default branch publish to Pages, so pushes to either branch
# below trigger the workflow, and it deploys only from whichever one is currently the default.
on:
  push:
    branches: [main, claude/epic-tesla-grl10q]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
